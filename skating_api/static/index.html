<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skating Data</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #20231f;
      --muted: #687066;
      --line: #d9ded6;
      --accent: #2f6f73;
      --accent-dark: #214f52;
      --warn: #8a5a12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1, h2, h3 { margin: 0; line-height: 1.15; }
    h1 { font-size: 20px; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      min-height: calc(100vh - 65px);
    }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfa;
      padding: 16px;
    }
    section { padding: 18px 22px; }
    .search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 16px;
    }
    input, button, select {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    input, select { padding: 8px 10px; background: white; color: var(--ink); }
    button {
      padding: 8px 12px;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      cursor: pointer;
    }
    button.secondary {
      background: white;
      color: var(--accent-dark);
      border-color: #9bb8b9;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .tabs button { font-size: 13px; padding: 6px 8px; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #eef2ec;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .badge.warn { background: #fbf0d9; color: var(--warn); }
    .pill {
      display: inline-block;
      padding: 1px 6px;
      margin-right: 3px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: help;
      border: 1px solid transparent;
    }
    .pill.negative { background: #fbe5e2; color: #8a2d22; border-color: #f1c4bd; }
    .pill.info     { background: #fbf0d9; color: var(--warn);  border-color: #efd8a4; }
    .pill.positive { background: #def0e1; color: #225f31;  border-color: #b9dec0; }
    .pill.neutral  { background: #eef2ec; color: var(--muted); border-color: var(--line); }
    .num.pos { color: #225f31; font-weight: 600; }
    .num.neg { color: #8a2d22; font-weight: 600; }
    .num.bonus { background: #def0e1; color: #225f31; padding: 1px 5px; border-radius: 4px; font-weight: 600; }
    /* Trimmed judge marks (ISU rule: drop highest + lowest before averaging).
       Keep the value at full color/weight so it stays readable; flag the cell
       with a soft warm tint and a tiny ∅ superscript that doesn't compete
       with the number. Tooltip explains the rule. */
    .judge-trim {
      position: relative;
      background: #fbf6e6;
      cursor: help;
    }
    .judge-trim::after {
      content: "∅";
      font-size: 9px;
      vertical-align: super;
      margin-left: 2px;
      color: var(--warn);
      opacity: .65;
    }
    .legend-key {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .tabs button[aria-selected="true"] { background: var(--accent-dark); color: white; }
    .list {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 210px);
      overflow: auto;
      padding-right: 4px;
    }
    .item {
      width: 100%;
      text-align: left;
      background: white;
      color: var(--ink);
      border-color: var(--line);
      min-height: 0;
    }
    .item strong { display: block; font-size: 14px; margin-bottom: 3px; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .stack { display: grid; gap: 14px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    [hidden] { display: none !important; }
    #list-controls { margin-bottom: 10px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #eef2ec; }
    th .sort-arrow { font-size: 10px; margin-left: 3px; }
    .controls label { color: var(--muted); font-size: 12px; }
    .pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .pager button { min-height: 32px; padding: 5px 10px; }
    .pager button:disabled {
      cursor: default;
      opacity: .45;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; background: #fbfcfa; }
    tr:last-child td { border-bottom: 0; }
    a { color: var(--accent-dark); }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      background: rgba(255,255,255,.55);
    }
    @media (max-width: 860px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .list { max-height: 280px; }
      .grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      section { padding: 16px; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Skating Data</h1>
      <div class="muted">Skaters, competitions, score details, and source evidence</div>
    </div>
    <div class="controls">
      <button class="secondary" id="back" hidden>← Back</button>
      <button class="secondary" id="refresh">Refresh</button>
    </div>
  </header>
  <main>
    <aside>
      <div class="tabs" role="tablist">
        <button id="dashboard-tab" aria-selected="true">Dashboard</button>
        <button id="club-tab" class="secondary" aria-selected="false">Clubs</button>
        <button id="skater-tab" class="secondary" aria-selected="false">Skaters</button>
        <button id="event-tab" class="secondary" aria-selected="false">Events</button>
        <button id="nationality-tab" class="secondary" aria-selected="false">Nations</button>
      </div>
      <form class="search" id="search-form">
        <input id="search" type="search" placeholder="Search">
        <button type="submit">Go</button>
      </form>
      <div class="controls" id="list-controls" hidden>
        <label for="list-sort">Sort</label>
        <select id="list-sort"></select>
        <select id="list-direction">
          <option value="desc">Desc</option>
          <option value="asc">Asc</option>
        </select>
        <label for="list-page-size">Rows</label>
        <select id="list-page-size">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="250">250</option>
        </select>
      </div>
      <div class="list" id="results"></div>
      <div class="pager" id="list-pager" hidden>
        <span class="muted" id="list-count"></span>
        <button class="secondary" id="list-prev">Previous</button>
        <button class="secondary" id="list-next">Next</button>
      </div>
    </aside>
    <section id="detail">
      <div class="empty">Loading dashboard...</div>
    </section>
  </main>
  <script>
    const LIST_SORT_OPTIONS = {
      clubs: [
        ["segment_scores", "Segment scores"],
        ["skaters", "Skaters"],
        ["events", "Events"],
        ["best_tss", "Best TSS"],
        ["latest_seen_date", "Latest activity"],
        ["club_name", "Club name"]
      ],
      skaters: [
        ["latest_seen_date", "Latest activity"],
        ["best_tss", "Best TSS"],
        ["competitions", "Competitions"],
        ["source_appearances", "Source appearances"],
        ["skater_name", "Skater name"]
      ],
      events: [
        ["event_start_date", "Event date"],
        ["event_name", "Event name"]
      ],
      nationalities: [
        ["segment_scores", "Segment scores"],
        ["skaters", "Skaters"],
        ["events", "Events"],
        ["best_tss", "Best TSS"],
        ["development_skaters", "Mlad Figurist"],
        ["nation_code", "Nation code"]
      ]
    };
    const LIST_DEFAULT_SORT = {
      clubs: { key: "segment_scores", direction: "desc" },
      skaters: { key: "latest_seen_date", direction: "desc" },
      events: { key: "event_start_date", direction: "desc" },
      nationalities: { key: "segment_scores", direction: "desc" }
    };
    const LIST_FETCH_LIMIT = 500;

    const state = {
      mode: "dashboard",
      items: [],
      currentClub: null,
      clubSkaterSort: { key: "skater_name", direction: "asc" },
      clubSkaterPage: 1,
      clubSkaterPageSize: 50,
      legend: null,
      listSort: { ...LIST_DEFAULT_SORT },
      listPage: 1,
      listPageSize: 50,
      dashboardData: null,
      dashboardPage: { competition_mix: 1, clubs: 1, nationalities: 1 },
      dashboardPageSize: 10,
      dashboardSort: {
        competition_mix: { key: "events", direction: "desc" },
        clubs: { key: "segment_scores", direction: "desc" },
        nationalities: { key: "segment_scores", direction: "desc" }
      },
      currentNation: null,
      nationSkaterSort: { key: "best_tss", direction: "desc" },
      nationSkaterPage: 1,
      nationSkaterPageSize: 50,
      dashboardPeriod: { from: null, to: null },
      dashboardYearBounds: { min: 2013, max: 2026 }
    };

    const NATION_SKATER_COLUMNS = [
      { label: "Skater",        key: "skater_name",      kind: "text" },
      { label: "Club",          key: "club_name",        kind: "text" },
      { label: "Competitions",  key: "competitions",     kind: "num"  },
      { label: "Best TSS",      key: "best_tss",         kind: "num"  },
      { label: "Latest",        key: "latest_seen_date", kind: "text" }
    ];

    const DASHBOARD_PANELS = {
      competition_mix: {
        title: "Competition Mix",
        columns: [
          { label: "Scope",   key: "scope_hint",                kind: "text" },
          { label: "Stream",  key: "competition_stream",        kind: "text" },
          { label: "Level",   key: "competition_level",         kind: "text" },
          { label: "Events",  key: "events",                    kind: "num"  },
          { label: "Skaters", key: "skaters_with_appearances",  kind: "num"  },
          { label: "Clubs",   key: "clubs_with_appearances",    kind: "num"  },
          { label: "Scores",  key: "segment_scores",            kind: "num"  }
        ]
      },
      clubs: {
        title: "Active Clubs",
        columns: [
          { label: "Club",    key: "club_name",      kind: "text" },
          { label: "Country", key: "country_code",   kind: "text" },
          { label: "Skaters", key: "skaters",        kind: "num"  },
          { label: "Events",  key: "events",         kind: "num"  },
          { label: "Scores",  key: "segment_scores", kind: "num"  },
          { label: "Best",    key: "best_tss",       kind: "num"  }
        ]
      },
      nationalities: {
        title: "Active Nationalities",
        columns: [
          { label: "Nationality", key: "nation_code",                    kind: "text" },
          { label: "Skaters",     key: "skaters",                        kind: "num"  },
          { label: "Mlad",        key: "development_skaters",            kind: "num"  },
          { label: "Converted",   key: "converted_development_skaters",  kind: "num"  },
          { label: "Events",      key: "events",                         kind: "num"  },
          { label: "Scores",      key: "segment_scores",                 kind: "num"  },
          { label: "Best",        key: "best_tss",                       kind: "num"  }
        ]
      }
    };

    // ISU element-marker severity. negative = base value or GOE penalty;
    // info = informational/no automatic deduction; positive = credit/bonus.
    const MARKER_SEVERITY = {
      "<<": "negative", "<": "negative", e: "negative", F: "negative", "*": "negative",
      "!": "info", q: "info", REP: "info", b: "info",
      x: "positive"
    };
    const MARKER_FALLBACK = {
      "<<": "Downgraded jump",
      "<": "Under-rotated jump",
      e: "Wrong edge",
      "!": "Not clear edge",
      q: "Landed on the quarter",
      F: "Fall associated with the element",
      "*": "Invalid element",
      x: "Highlight distribution bonus (later-program credit)",
      b: "Source-specific bonus marker",
      REP: "Repetition"
    };

    async function ensureLegend() {
      if (state.legend) return state.legend;
      try {
        const data = await getJson("/api/legend");
        state.legend = {};
        for (const row of data.markers || []) state.legend[row.code] = row;
      } catch (e) {
        state.legend = {};
      }
      return state.legend;
    }

    function markerMeaning(code) {
      const entry = state.legend && state.legend[code];
      if (entry && entry.meaning) return `${entry.label}: ${entry.meaning}`;
      if (MARKER_FALLBACK[code]) return MARKER_FALLBACK[code];
      return code;
    }

    function renderMarkerPills(markers) {
      if (!Array.isArray(markers) || markers.length === 0) return '<span class="muted">—</span>';
      return markers.map((code) => {
        const sev = MARKER_SEVERITY[code] || "neutral";
        const tip = markerMeaning(code).replace(/"/g, "&quot;");
        return `<span class="pill ${sev}" title="${tip}">${fmt(code)}</span>`;
      }).join("");
    }

    // ISU panel-score rule (current): with a panel of 5+ judges, drop the
    // highest and the lowest judge mark per element/component and average
    // the remaining. With smaller panels (3 or 4 judges) every mark is
    // averaged — trimming would leave too few values.
    function trimmedJudgeIndices(judgeMarks) {
      if (!Array.isArray(judgeMarks)) return new Set();
      const numeric = judgeMarks
        .map((mark, idx) => ({ idx, score: mark && mark.score }))
        .filter((entry) => typeof entry.score === "number");
      if (numeric.length < 5) return new Set();
      let high = numeric[0];
      let low = numeric[0];
      for (const entry of numeric) {
        if (entry.score > high.score) high = entry;
        if (entry.score < low.score) low = entry;
      }
      const trim = new Set();
      trim.add(high.idx);
      if (low.idx !== high.idx) trim.add(low.idx);
      return trim;
    }

    // ISU element-code dictionary. Decomposes codes like 4T, 2Lz+3T,
    // CCoSp4, FSSp4V, ChSq1, StSq3, SEQ/REP markers into human-readable
    // labels for tooltips and for the contextual legend below the table.
    const JUMP_LETTERS = {
      A: "Axel", F: "Flip", Lz: "Lutz", Lo: "Loop", S: "Salchow", T: "Toe Loop", Eu: "Euler"
    };
    const ROTATION_NAMES = ["", "Single", "Double", "Triple", "Quad"];
    const SPIN_PREFIXES = [
      ["FCCoSp", "Flying Change Combination Spin"],
      ["CCoSp", "Change Combination Spin"],
      ["CoSp", "Combination Spin"],
      ["FCSSp", "Flying Change Sit Spin"],
      ["FCLSp", "Flying Change Layback Spin"],
      ["FCCSp", "Flying Change Camel Spin"],
      ["FSSp", "Flying Sit Spin"],
      ["FCSp", "Flying Camel Spin"],
      ["FLSp", "Flying Layback Spin"],
      ["CSSp", "Change Sit Spin"],
      ["CLSp", "Change Layback Spin"],
      ["CCSp", "Change Camel Spin"],
      ["SSp", "Sit Spin"],
      ["LSp", "Layback Spin"],
      ["CSp", "Camel Spin"],
      ["USp", "Upright Spin"]
    ];
    const STEP_PREFIXES = [
      ["StSq", "Step Sequence"],
      ["ChSq", "Choreographic Sequence"],
      ["ChSt", "Choreographic Step Sequence"],
      ["ChSp", "Choreographic Spin"],
      ["SpSq", "Spiral Sequence"],
      ["PiF",  "Pivot Figure"]
    ];

    // ISU markers can appear embedded in element_code text (e.g. "3F!",
    // "2Lo<x", "3Lz<<"). They never appear inside the structural prefix —
    // only at the end of a single token. Keep parsing structural-prefix-aware
    // so we don't strip jump letters (F = Flip, S = Salchow) or spin-prefix
    // letters (FCSp, FSSp) by accident.
    const MARKER_TAIL = /(?:<<|<|!|e|q|\*|F|x|b)+$/;

    function describeElementToken(token) {
      const raw = String(token || "").trim();
      if (!raw) return "";
      if (/^SEQ$/i.test(raw)) return "Jump Sequence";
      if (/^REP$/i.test(raw)) return "Repetition";
      // Jump: leading digit + jump letters. Try longest letter prefix first
      // (Lz / Lo / Eu before single-letter A/F/S/T).
      const jump = raw.match(/^(\d)(Lz|Lo|Eu|A|F|S|T)/);
      if (jump) {
        const rotation = ROTATION_NAMES[Number(jump[1])] || `${jump[1]}-rotation`;
        return `${rotation} ${JUMP_LETTERS[jump[2]] || jump[2]}`;
      }
      // Spin: longest prefix wins (SPIN_PREFIXES is ordered from longest).
      for (const [prefix, label] of SPIN_PREFIXES) {
        if (raw.startsWith(prefix)) {
          const tail = raw.slice(prefix.length).replace(MARKER_TAIL, "");
          const level = tail.replace(/V$/i, "");
          const variation = /V$/i.test(tail) ? " (feature variation)" : "";
          return `${label}${level ? ` lvl ${level}` : ""}${variation}`;
        }
      }
      for (const [prefix, label] of STEP_PREFIXES) {
        if (raw.startsWith(prefix)) {
          const tail = raw.slice(prefix.length).replace(MARKER_TAIL, "");
          return `${label}${tail ? ` lvl ${tail}` : ""}`;
        }
      }
      return raw;
    }

    function describeElement(code) {
      const raw = String(code || "").trim();
      if (!raw) return "";
      const parts = raw.split("+").filter((part) => part.length > 0);
      return parts.map(describeElementToken).filter(Boolean).join(" + ");
    }

    function elementLegendEntries(elements) {
      const seen = new Map();
      for (const element of elements || []) {
        const code = element.base_element_code || element.element_code;
        if (!code || seen.has(code)) continue;
        const description = describeElement(code);
        if (description && description !== code) seen.set(code, description);
      }
      return [...seen.entries()];
    }

    function numCell(value, mode) {
      if (value === null || value === undefined || value === "") return '<td class="muted">—</td>';
      const num = typeof value === "number" ? value : Number(value);
      if (Number.isNaN(num)) return `<td>${fmt(value)}</td>`;
      // Bonus column: zero is meaningful (no bonus applied) and should read
      // as a dash rather than "0.00", which looks like a real value.
      if (mode === "bonus" && num === 0) return '<td class="muted">—</td>';
      const cls = mode === "goe" ? (num > 0 ? "num pos" : num < 0 ? "num neg" : "")
                : mode === "bonus" ? "num bonus"
                : "";
      const text = mode === "bonus" && num > 0 ? `+${num.toFixed(2)}` : num.toFixed(2);
      return `<td class="${cls}">${text}</td>`;
    }
    const results = document.querySelector("#results");
    const detail = document.querySelector("#detail");
    const search = document.querySelector("#search");

    const fmt = (value) => value === null || value === undefined || value === "" ? "—" : value;
    const points = (value) => typeof value === "number" ? value.toFixed(2) : fmt(value);
    const statusLabel = (value) => ({
      national_competitor: "National",
      recreational: "Recreational",
      mixed: "Mixed",
      development: "Mlad Figurist"
    }[value] || fmt(value));
    const developmentLabel = (skater) => {
      if (!skater.has_development_event) return "—";
      return skater.competitor_status === "development" ? "Mlad only" : "Converted";
    };
    const sortLabels = {
      skater_name: "Skater",
      development_path: "Mlad Path",
      competitions: "Competitions",
      best_tss: "Best TSS",
      latest_seen_date: "Latest"
    };

    async function getJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function setTabState(mode) {
      ["dashboard", "club", "skater", "event", "nationality"].forEach((name) => {
        const tab = document.querySelector(`#${name}-tab`);
        if (!tab) return;
        const selected = mode === `${name}s` || mode === name;
        tab.setAttribute("aria-selected", selected);
        tab.className = selected ? "" : "secondary";
      });
    }

    function setMode(mode) {
      state.mode = mode;
      setTabState(mode);
      if (mode === "dashboard") {
        results.innerHTML = "";
        document.querySelector("#list-controls").hidden = true;
        document.querySelector("#list-pager").hidden = true;
        return loadDashboard();
      }
      return loadList();
    }

    // Hash routing: #dashboard, #skaters, #clubs, #events, #nationalities,
    // #skater/<id>, #club/<encoded>, #event/<id>, #score/<id>, #nation/<code>.
    // navigate(route) pushes browser history; popstate / page-load read the
    // current hash and dispatch. The "← Back" header button just calls
    // history.back() — the browser already knows how to walk the stack and
    // gracefully leaves the site if there's nothing to go back to.
    const LIST_ROUTES = new Set(["skaters", "clubs", "events", "nationalities"]);

    function parseRoute(hash) {
      const h = String(hash || "").replace(/^#/, "");
      if (!h || h === "dashboard") return { type: "dashboard" };
      const slash = h.indexOf("/");
      if (slash === -1) return { type: h };
      return { type: h.slice(0, slash), id: h.slice(slash + 1) };
    }

    function routeToHash(route) {
      if (typeof route === "string") return route;
      return route.type + (route.id ? "/" + route.id : "");
    }

    function updateBackButton(route) {
      const r = typeof route === "string" ? parseRoute(route) : route;
      const btn = document.querySelector("#back");
      if (!btn) return;
      btn.hidden = r.type === "dashboard";
    }

    function parsePeriodId(id) {
      // "2020-2024" -> {from: 2020, to: 2024}; "2025"/"2025-" -> {from:2025,to:null}; etc.
      if (!id) return { from: null, to: null };
      const parts = String(id).split("-");
      const from = parts[0] && /^\d{4}$/.test(parts[0]) ? Number(parts[0]) : null;
      const to = parts[1] && /^\d{4}$/.test(parts[1]) ? Number(parts[1]) : (parts.length === 1 ? from : null);
      return { from, to };
    }

    function periodHashId(period) {
      const { from, to } = period || {};
      if (!from && !to) return "";
      if (from && to && from === to) return String(from);
      return `${from || ""}-${to || ""}`;
    }

    async function dispatchRoute(route) {
      const r = typeof route === "string" ? parseRoute(route) : route;
      updateBackButton(r);
      switch (r.type) {
        case "dashboard":
          state.dashboardPeriod = parsePeriodId(r.id);
          setMode("dashboard");
          return;
        case "skaters":
        case "clubs":
        case "events":
        case "nationalities":
          setMode(r.type);
          return;
        case "skater":       return showSkater(r.id);
        case "club":         return showClub(r.id);
        case "event":        return showEvent(r.id);
        case "score":        return showScore(r.id);
        case "nation":       return showNationality(r.id);
        default:
          return dispatchRoute({ type: "dashboard" });
      }
    }

    function navigate(route) {
      const hash = routeToHash(route);
      const target = "#" + hash;
      if (window.location.hash !== target) {
        history.pushState({ route: hash }, "", target);
      }
      return dispatchRoute(route);
    }

    function listItemHtml(item) {
      if (state.mode === "skaters") {
        return `<button class="item" data-id="${item.skater_key}">
          <strong>${fmt(item.skater_name)}</strong>
          <span class="muted">${fmt(item.nation_display)} · ${fmt(item.club_name)} · ${fmt(item.competitions)} competitions · best ${points(item.best_tss)}</span>
        </button>`;
      }
      if (state.mode === "clubs") {
        return `<button class="item" data-id="${encodeURIComponent(item.club_name)}">
          <strong>${fmt(item.club_name)}</strong>
          <span class="muted">${fmt(item.country_display)} · ${fmt(item.skaters)} skaters · ${fmt(item.events)} events · best ${points(item.best_tss)}</span>
        </button>`;
      }
      if (state.mode === "nationalities") {
        return `<button class="item" data-id="${encodeURIComponent(item.nation_code)}">
          <strong>${fmt(item.nation_display)}</strong>
          <span class="muted">${fmt(item.skaters)} skaters · ${fmt(item.events)} events · best ${points(item.best_tss)}</span>
        </button>`;
      }
      return `<button class="item" data-id="${item.event_key}">
        <strong>${fmt(item.event_name)}</strong>
        <span class="muted">${fmt(item.event_start_date)} · ${fmt(item.location)} · ${fmt(item.competition_level)}</span>
      </button>`;
    }

    function sortedListItems() {
      const sort = state.listSort[state.mode] || LIST_DEFAULT_SORT[state.mode];
      if (!sort) return state.items;
      return [...state.items].sort((a, b) => compareValues(a[sort.key], b[sort.key], sort.direction)
        || compareValues(a.skater_name || a.club_name || a.nation_code || a.event_name,
                         b.skater_name || b.club_name || b.nation_code || b.event_name,
                         "asc"));
    }

    function pagedListItems() {
      const sorted = sortedListItems();
      const total = sorted.length;
      const pages = Math.max(1, Math.ceil(total / state.listPageSize));
      state.listPage = Math.min(Math.max(1, state.listPage), pages);
      const start = (state.listPage - 1) * state.listPageSize;
      const end = Math.min(start + state.listPageSize, total);
      return { rows: sorted.slice(start, end), total, start, end, pages };
    }

    function renderListControls() {
      const controls = document.querySelector("#list-controls");
      const pager = document.querySelector("#list-pager");
      if (!LIST_SORT_OPTIONS[state.mode]) {
        controls.hidden = true;
        pager.hidden = true;
        return;
      }
      controls.hidden = false;
      const sort = state.listSort[state.mode] || LIST_DEFAULT_SORT[state.mode];
      const sortSelect = document.querySelector("#list-sort");
      sortSelect.innerHTML = LIST_SORT_OPTIONS[state.mode]
        .map(([key, label]) => `<option value="${key}"${sort.key === key ? " selected" : ""}>${label}</option>`)
        .join("");
      document.querySelector("#list-direction").value = sort.direction;
      document.querySelector("#list-page-size").value = String(state.listPageSize);
    }

    function renderList() {
      renderListControls();
      const pager = document.querySelector("#list-pager");
      const page = pagedListItems();
      if (page.total === 0) {
        results.innerHTML = '<div class="empty">No matches.</div>';
        pager.hidden = true;
        return;
      }
      results.innerHTML = page.rows.map(listItemHtml).join("");
      pager.hidden = false;
      const cappedHint = state.items.length >= LIST_FETCH_LIMIT ? " (capped — refine search)" : "";
      document.querySelector("#list-count").textContent = `${page.start + 1}-${page.end} of ${page.total}${cappedHint}`;
      document.querySelector("#list-prev").disabled = state.listPage <= 1;
      document.querySelector("#list-next").disabled = state.listPage >= page.pages;
    }

    async function loadList() {
      renderListControls();
      results.innerHTML = '<div class="muted">Loading...</div>';
      document.querySelector("#list-pager").hidden = true;
      const q = encodeURIComponent(search.value.trim());
      const data = await getJson(`/api/${state.mode}?limit=${LIST_FETCH_LIMIT}${q ? `&q=${q}` : ""}`);
      state.items = data.items || [];
      state.listPage = 1;
      renderList();
    }

    function renderClubList(items) {
      results.innerHTML = items.map((item) => `<button class="item" data-id="${encodeURIComponent(item.club_name)}">
        <strong>${fmt(item.club_name)}</strong>
        <span class="muted">${fmt(item.country_display)} · ${fmt(item.skaters)} skaters · ${fmt(item.events)} events · best ${points(item.best_tss)}</span>
      </button>`).join("") || '<div class="empty">No clubs.</div>';
    }

    function table(headers, rows) {
      return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    function clubSkaterSortValue(skater, key) {
      if (key === "development_path") return developmentLabel(skater);
      return skater[key];
    }

    function compareValues(a, b, direction) {
      const emptyA = a === null || a === undefined || a === "";
      const emptyB = b === null || b === undefined || b === "";
      if (emptyA && emptyB) return 0;
      if (emptyA) return 1;
      if (emptyB) return -1;
      const result = typeof a === "number" && typeof b === "number"
        ? a - b
        : String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
      return direction === "asc" ? result : -result;
    }

    function sortedClubSkaters(rows) {
      const { key, direction } = state.clubSkaterSort;
      return [...rows].sort((a, b) => {
        const first = compareValues(clubSkaterSortValue(a, key), clubSkaterSortValue(b, key), direction);
        return first || compareValues(a.skater_name, b.skater_name, "asc");
      });
    }

    function pagedClubSkaters(rows) {
      const sorted = sortedClubSkaters(rows);
      const total = sorted.length;
      const pageSize = state.clubSkaterPageSize;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      state.clubSkaterPage = Math.min(Math.max(1, state.clubSkaterPage), pages);
      const start = (state.clubSkaterPage - 1) * pageSize;
      return {
        rows: sorted.slice(start, start + pageSize),
        total,
        start,
        end: Math.min(start + pageSize, total),
        pages
      };
    }

    function renderClubSkaterRows(rows) {
      return pagedClubSkaters(rows).rows.map((s) => `
        <tr><td><a href="#" data-skater="${s.skater_key}">${fmt(s.skater_name)}</a></td><td>${fmt(s.nation_display)}</td><td>${statusLabel(s.competitor_status)}</td><td>${developmentLabel(s)}</td><td>${fmt(s.competitions)}</td><td>${points(s.best_tss)}</td><td>${fmt(s.latest_seen_date)}</td></tr>`).join("");
    }

    function refreshClubSkaterRows() {
      const tbody = document.querySelector("#club-skater-rows");
      if (!tbody || !state.currentClub) return;
      const page = pagedClubSkaters(state.currentClub.skater_rows || []);
      tbody.innerHTML = page.rows.map((s) => `
        <tr><td><a href="#" data-skater="${s.skater_key}">${fmt(s.skater_name)}</a></td><td>${fmt(s.nation_display)}</td><td>${statusLabel(s.competitor_status)}</td><td>${developmentLabel(s)}</td><td>${fmt(s.competitions)}</td><td>${points(s.best_tss)}</td><td>${fmt(s.latest_seen_date)}</td></tr>`).join("");
      const count = document.querySelector("#club-skater-count");
      if (count) count.textContent = page.total ? `${page.start + 1}-${page.end} of ${page.total}` : "0 of 0";
      const prev = document.querySelector("#club-skater-prev");
      const next = document.querySelector("#club-skater-next");
      if (prev) prev.disabled = state.clubSkaterPage <= 1;
      if (next) next.disabled = state.clubSkaterPage >= page.pages;
    }

    function sortedDashboardItems(panelKey) {
      const items = (state.dashboardData && state.dashboardData[panelKey]) || [];
      const sort = state.dashboardSort[panelKey];
      if (!sort) return items;
      return [...items].sort((a, b) => compareValues(a[sort.key], b[sort.key], sort.direction)
        || compareValues(a.club_name || a.nation_code || a.competition_stream, b.club_name || b.nation_code || b.competition_stream, "asc"));
    }

    function sortIndicator(panelKey, columnKey) {
      const sort = state.dashboardSort[panelKey];
      if (!sort || sort.key !== columnKey) return '<span style="opacity:.25">↕</span>';
      return sort.direction === "desc" ? "▼" : "▲";
    }

    function dashboardPanel(panelKey) {
      const config = DASHBOARD_PANELS[panelKey];
      if (!config) return "";
      const rowFn = ROW_RENDERERS[panelKey];
      const items = sortedDashboardItems(panelKey);
      const total = items.length;
      const pageSize = state.dashboardPageSize;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      state.dashboardPage[panelKey] = Math.min(Math.max(1, state.dashboardPage[panelKey] || 1), pages);
      const page = state.dashboardPage[panelKey];
      const start = (page - 1) * pageSize;
      const end = Math.min(start + pageSize, total);
      const slice = items.slice(start, end);
      const counter = total ? `${start + 1}-${end} of ${total}` : "0 of 0";
      const prevDisabled = page <= 1 ? " disabled" : "";
      const nextDisabled = page >= pages ? " disabled" : "";
      const showPager = total > pageSize;
      const pager = showPager ? `
        <div class="controls">
          <span class="muted" data-dashboard-count>${counter}</span>
          <button class="secondary" data-dashboard-step="-1" data-dashboard-target="${panelKey}"${prevDisabled}>Prev</button>
          <button class="secondary" data-dashboard-step="1" data-dashboard-target="${panelKey}"${nextDisabled}>Next</button>
        </div>` : `<div class="muted" style="font-size:11px">${counter}</div>`;
      const headerRow = config.columns.map((col) =>
        `<th class="sortable" data-dashboard-sort="${panelKey}" data-sort-key="${col.key}" title="Sort by ${col.label}">${col.label} <span class="sort-arrow">${sortIndicator(panelKey, col.key)}</span></th>`
      ).join("");
      const body = slice.map(rowFn).join("");
      return `
        <div class="panel" data-dashboard-panel="${panelKey}">
          <div class="toolbar">
            <h3>${config.title}</h3>
            ${pager}
          </div>
          ${body
            ? `<table><thead><tr>${headerRow}</tr></thead><tbody>${body}</tbody></table>`
            : '<div class="muted">No rows.</div>'}
        </div>`;
    }

    const ROW_RENDERERS = {
      competition_mix: (m) => competitionMixRow(m),
      clubs: (c) => activeClubRow(c),
      nationalities: (n) => activeNationalityRow(n)
    };

    function competitionMixRow(m) {
      return `<tr><td>${fmt(m.scope_hint)}</td><td>${fmt(m.competition_stream)}</td><td>${fmt(m.competition_level)}</td><td>${fmt(m.events)}</td><td>${fmt(m.skaters_with_appearances)}</td><td>${fmt(m.clubs_with_appearances)}</td><td>${fmt(m.segment_scores)}</td></tr>`;
    }
    function activeClubRow(c) {
      return `<tr><td><a href="#" data-club="${encodeURIComponent(c.club_name)}">${fmt(c.club_name)}</a></td><td>${fmt(c.country_display || c.country_code)}</td><td>${fmt(c.skaters)}</td><td>${fmt(c.events)}</td><td>${fmt(c.segment_scores)}</td><td>${points(c.best_tss)}</td></tr>`;
    }
    function activeNationalityRow(n) {
      return `<tr><td><a href="#" data-nation="${encodeURIComponent(n.nation_code)}">${fmt(n.nation_display)}</a></td><td>${fmt(n.skaters)}</td><td>${fmt(n.development_skaters)}</td><td>${fmt(n.converted_development_skaters)}</td><td>${fmt(n.events)}</td><td>${fmt(n.segment_scores)}</td><td>${points(n.best_tss)}</td></tr>`;
    }

    function renderDashboardPanels() {
      if (!state.dashboardData) return "";
      return ["competition_mix", "clubs", "nationalities"].map(dashboardPanel).join("");
    }

    function dashboardPeriodQuery() {
      const p = state.dashboardPeriod;
      if (!p || (!p.from && !p.to)) return "";
      const params = [];
      if (p.from) params.push(`from_year=${p.from}`);
      if (p.to) params.push(`to_year=${p.to}`);
      return "?" + params.join("&");
    }

    function dashboardPeriodLabel() {
      const p = state.dashboardPeriod;
      if (!p || (!p.from && !p.to)) return "All years";
      if (p.from && p.to && p.from === p.to) return `Year ${p.from}`;
      return `${p.from || "—"} to ${p.to || "—"}`;
    }

    function yearOptionsHtml(min, max, selected) {
      const options = [`<option value=""${selected ? "" : " selected"}>All</option>`];
      for (let y = max; y >= min; y--) {
        options.push(`<option value="${y}"${String(selected) === String(y) ? " selected" : ""}>${y}</option>`);
      }
      return options.join("");
    }

    async function loadDashboard() {
      detail.innerHTML = '<div class="empty">Loading dashboard...</div>';
      const data = await getJson("/api/dashboard" + dashboardPeriodQuery());
      state.dashboardData = data;
      state.dashboardPage = { competition_mix: 1, clubs: 1, nationalities: 1 };
      const o = data.overview;
      // Discover the available year range from the all-time first/latest dates
      // exposed in the overview. Fallback to a sensible default if missing.
      if (o.first_event_date) {
        state.dashboardYearBounds.min = Number(String(o.first_event_date).slice(0, 4));
      }
      if (o.latest_event_date) {
        state.dashboardYearBounds.max = Number(String(o.latest_event_date).slice(0, 4));
      }
      const { min: yMin, max: yMax } = state.dashboardYearBounds;
      const p = state.dashboardPeriod || {};
      const periodLabel = dashboardPeriodLabel();
      const isFiltered = !!(p.from || p.to);
      detail.innerHTML = `
        <div class="stack">
          <div class="toolbar">
            <div>
              <h2>Dashboard</h2>
              <div class="muted">${periodLabel} · ${fmt(o.first_event_date)} to ${fmt(o.latest_event_date)}</div>
            </div>
            <div class="controls">
              <label for="dashboard-from-year">From</label>
              <select id="dashboard-from-year">${yearOptionsHtml(yMin, yMax, p.from || "")}</select>
              <label for="dashboard-to-year">to</label>
              <select id="dashboard-to-year">${yearOptionsHtml(yMin, yMax, p.to || "")}</select>
              ${isFiltered ? '<button class="secondary" id="dashboard-clear-period">Clear</button>' : ''}
            </div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">Events</div><div class="value">${fmt(o.events)}</div></div>
            <div class="metric"><div class="label">Skaters</div><div class="value">${fmt(o.skaters)}</div></div>
            <div class="metric"><div class="label">Clubs</div><div class="value">${fmt(o.scoring_clubs)}</div></div>
            <div class="metric"><div class="label">Segment Scores</div><div class="value">${fmt(o.segment_scores)}</div></div>
          </div>
          <div class="grid">
            <button class="metric item" data-scope="international"><div class="label">International</div><div class="value">${fmt(o.international_events)}</div></button>
            <button class="metric item" data-scope="federation"><div class="label">Federation</div><div class="value">${fmt(o.federation_events)}</div></button>
            <button class="metric item" data-scope="club_or_open"><div class="label">Club/Open</div><div class="value">${fmt(o.club_or_open_events)}</div></button>
            <div class="metric"><div class="label">Mlad Figurist</div><div class="value">${fmt(o.development_skaters)}</div></div>
          </div>
          ${renderDashboardPanels()}
        </div>`;
    }

    function refreshDashboardPanel(panelKey) {
      const node = document.querySelector(`[data-dashboard-panel="${panelKey}"]`);
      if (!node || !DASHBOARD_PANELS[panelKey]) return;
      const wrapper = document.createElement("div");
      wrapper.innerHTML = dashboardPanel(panelKey);
      node.replaceWith(wrapper.firstElementChild);
    }

    async function showSkater(id) {
      const skater = await getJson(`/api/skaters/${id}`);
      detail.innerHTML = `
        <div class="stack">
          <div>
            <h2>${fmt(skater.skater_name)}</h2>
            <div class="muted">${fmt(skater.nation_display)} · ${fmt(skater.club_name)} · seen ${fmt(skater.first_seen_date)} to ${fmt(skater.latest_seen_date)}</div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">Best TSS</div><div class="value">${points(skater.best_tss)}</div></div>
            <div class="metric"><div class="label">Best TES</div><div class="value">${points(skater.best_tes)}</div></div>
            <div class="metric"><div class="label">Best PCS</div><div class="value">${points(skater.best_pcs)}</div></div>

              <tr>

              <tr><td>${fmt(e.date_key)}</td><td>${fmt(e.segment_name)}</td><td>${fmt(e.element_no)}</td><td>${fmt(e.element_code)}</td><td>${points(e.base_value)}</td><td>${points(e.goe)}</td><td>${points(e.panel_score)}</td></tr>`).join(""))}
          </div>

    async function showEvent(id) {
      const event = await getJson(`/api/events/${id}`);
      const byCategory = new Map();
      for (const result of event.results || []) {
        const key = result.category_name || "(no category)";
        if (!byCategory.has(key)) byCategory.set(key, []);
        byCategory.get(key).push(result);
      }
      const sortedCategories = [...byCategory.entries()].sort(([a], [b]) => a.localeCompare(b));
      const categoryPanels = sortedCategories.map(([category, rows]) => {
        const sortedRows = [...rows].sort((a, b) => compareValues(a.final_place, b.final_place, "asc"));
        return `
          <div class="panel">
            <h3>${fmt(category)} <span class="muted" style="font-weight:400;font-size:12px">· ${rows.length} ${rows.length === 1 ? "skater" : "skaters"}</span></h3>
            ${table(["Place", "Skater", "Nation", "Club", "Points"], sortedRows.map((r) => `
              <tr>
                <td>${fmt(r.final_place)}</td>
                <td>${r.skater_key ? `<a href="#" data-skater="${r.skater_key}">${fmt(r.skater_name)}</a>` : fmt(r.skater_name)}</td>
                <td>${fmt(r.nation_display)}</td>
                <td>${r.club_name ? `<a href="#" data-club="${encodeURIComponent(r.club_name)}">${fmt(r.club_name)}</a>` : '<span class="muted">—</span>'}</td>
                <td>${points(r.points)}</td>
              </tr>`).join(""))}
          </div>`;
      }).join("");
      detail.innerHTML = `
        <div class="stack">
          <div>
            <h2>${fmt(event.event_name)}</h2>
            <div class="muted">${fmt(event.event_start_date)} · ${fmt(event.location)} · ${fmt(event.venue)}</div>
            <div><a href="${event.root_url}" target="_blank" rel="noreferrer">${fmt(event.root_url)}</a></div>
            <div class="muted" style="margin-top:6px">${sortedCategories.length} ${sortedCategories.length === 1 ? "category" : "categories"} · ${(event.results || []).length} total entries</div>
          </div>
          ${categoryPanels || '<div class="empty">No results recorded for this event.</div>'}
        </div>`;
    }

      detail.innerHTML = `

            <div class="muted">${fmt(club.country_display)} · ${fmt(club.first_seen_date)} to ${fmt(club.latest_seen_date)}</div>

          <div class="grid">
            <div class="metric"><div class="label">Skaters</div><div class="value">${fmt(club.skaters)}</div></div>

            <div class="metric"><div class="label">Scores</div><div class="value">${fmt(club.segment_scores)}</div></div>
            <div class="metric"><div class="label">Best TSS</div><div class="value">${points(club.best_tss)}</div></div>

          <div class="grid">
            <div class="metric"><div class="label">International</div><div class="value">${fmt(club.international_events)}</div></div>
            <div class="metric"><div class="label">Federation</div><div class="value">${fmt(club.federation_events)}</div></div>
            <div class="metric"><div class="label">Club/Open</div><div class="value">${fmt(club.club_or_open_events)}</div></div>
            <div class="metric"><div class="label">Best TES</div><div class="value">${points(club.best_tes)}</div></div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">National Competitors</div><div class="value">${fmt(club.national_competitors)}</div></div>
            <div class="metric"><div class="label">Recreational Only</div><div class="value">${fmt(club.recreational_only_skaters)}</div></div>
            <div class="metric"><div class="label">Mixed</div><div class="value">${fmt(club.mixed_competitors)}</div></div>
            <div class="metric"><div class="label">Best PCS</div><div class="value">${points(club.best_pcs)}</div></div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">Mlad Figurist</div><div class="value">${fmt(club.development_skaters)}</div></div>
            <div class="metric"><div class="label">Development Only</div><div class="value">${fmt(club.development_only_skaters)}</div></div>
            <div class="metric"><div class="label">Converted</div><div class="value">${fmt(club.converted_development_skaters)}</div></div>
          </div>
          <div class="panel">
            <div class="toolbar">
              <h3>Skaters</h3>
              <div class="controls">
                <label for="club-skater-sort">Sort</label>
                <select id="club-skater-sort">
                  ${Object.entries(sortLabels).map(([key, label]) => `<option value="${key}"${state.clubSkaterSort.key === key ? " selected" : ""}>${label}</option>`).join("")}
                </select>
                <select id="club-skater-direction">
                  <option value="asc"${state.clubSkaterSort.direction === "asc" ? " selected" : ""}>Ascending</option>
                  <option value="desc"${state.clubSkaterSort.direction === "desc" ? " selected" : ""}>Descending</option>
                </select>
                <label for="club-skater-page-size">Rows</label>
                <select id="club-skater-page-size">
                  ${[25, 50, 100, 250, 500].map((size) => `<option value="${size}"${state.clubSkaterPageSize === size ? " selected" : ""}>${size}</option>`).join("")}
                </select>
              </div>
            </div>
            <table>
              <thead><tr><th>Skater</th><th>Nation</th><th>Status</th><th>Mlad Path</th><th>Competitions</th><th>Best TSS</th><th>Latest</th></tr></thead>
              <tbody id="club-skater-rows">${skaterPage.rows.map((s) => `
                <tr><td><a href="#" data-skater="${s.skater_key}">${fmt(s.skater_name)}</a></td><td>${fmt(s.nation_display)}</td><td>${statusLabel(s.competitor_status)}</td><td>${developmentLabel(s)}</td><td>${fmt(s.competitions)}</td><td>${points(s.best_tss)}</td><td>${fmt(s.latest_seen_date)}</td></tr>`).join("")}</tbody>
            </table>
            <div class="pager">
              <span class="muted" id="club-skater-count">${skaterPage.total ? `${skaterPage.start + 1}-${skaterPage.end} of ${skaterPage.total}` : "0 of 0"}</span>
              <button class="secondary" id="club-skater-prev" data-page-step="-1"${state.clubSkaterPage <= 1 ? " disabled" : ""}>Previous</button>
              <button class="secondary" id="club-skater-next" data-page-step="1"${state.clubSkaterPage >= skaterPage.pages ? " disabled" : ""}>Next</button>
            </div>
          </div>
        </div>`;
    }

    function nationSkaterPage() {
      const items = (state.currentNation && state.currentNation.skaters_list) || [];
      const sort = state.nationSkaterSort;
      const sorted = [...items].sort((a, b) =>
        compareValues(a[sort.key], b[sort.key], sort.direction)
        || compareValues(a.skater_name, b.skater_name, "asc"));
      const total = sorted.length;
      const pageSize = state.nationSkaterPageSize;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      state.nationSkaterPage = Math.min(Math.max(1, state.nationSkaterPage), pages);
      const start = (state.nationSkaterPage - 1) * pageSize;
      const end = Math.min(start + pageSize, total);
      return { rows: sorted.slice(start, end), total, start, end, pages };
    }

    function nationSortIndicator(columnKey) {
      const sort = state.nationSkaterSort;
      if (sort.key !== columnKey) return '<span style="opacity:.25">↕</span>';
      return sort.direction === "desc" ? "▼" : "▲";
    }

    function renderNationSkaterTable() {
      const page = nationSkaterPage();
      const headerRow = NATION_SKATER_COLUMNS.map((col) =>
        `<th class="sortable" data-nation-sort data-sort-key="${col.key}" title="Sort by ${col.label}">${col.label} <span class="sort-arrow">${nationSortIndicator(col.key)}</span></th>`
      ).join("");
      const body = page.rows.map((s) => `
        <tr>
          <td><a href="#" data-skater="${s.skater_key}">${fmt(s.skater_name)}</a></td>
          <td>${s.club_name ? `<a href="#" data-club="${encodeURIComponent(s.club_name)}">${fmt(s.club_name)}</a>` : '<span class="muted">—</span>'}</td>
          <td>${fmt(s.competitions)}</td>
          <td>${points(s.best_tss)}</td>
          <td>${fmt(s.latest_seen_date)}</td>
        </tr>`).join("");
      const counter = page.total ? `${page.start + 1}-${page.end} of ${page.total}` : "0 of 0";
      const showPager = page.total > state.nationSkaterPageSize;
      const pager = showPager ? `
        <div class="controls">
          <span class="muted">${counter}</span>
          <button class="secondary" data-nation-page-step="-1"${page.pages <= 1 || state.nationSkaterPage <= 1 ? " disabled" : ""}>Prev</button>
          <button class="secondary" data-nation-page-step="1"${state.nationSkaterPage >= page.pages ? " disabled" : ""}>Next</button>
        </div>` : `<div class="muted" style="font-size:11px">${counter}</div>`;
      return `
        <div class="panel" id="nation-skater-panel">
          <div class="toolbar">
            <h3>Skaters</h3>
            ${pager}
          </div>
          ${page.total
            ? `<table><thead><tr>${headerRow}</tr></thead><tbody>${body}</tbody></table>`
            : '<div class="muted">No skaters indexed for this nation yet.</div>'}
        </div>`;
    }

    function refreshNationSkaterTable() {
      const node = document.querySelector("#nation-skater-panel");
      if (!node) return;
      const wrapper = document.createElement("div");
      wrapper.innerHTML = renderNationSkaterTable();
      node.replaceWith(wrapper.firstElementChild);
    }

    async function showNationality(code) {
      const nation = await getJson(`/api/nationalities/${encodeURIComponent(code)}`);
      state.currentNation = nation;
      state.nationSkaterPage = 1;
      detail.innerHTML = `
        <div class="stack">
          <div>
            <h2>${fmt(nation.nation_display)}</h2>
            <div class="muted">${fmt(nation.first_seen_date)} to ${fmt(nation.latest_seen_date)}</div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">Skaters</div><div class="value">${fmt(nation.skaters)}</div></div>
            <div class="metric"><div class="label">Events</div><div class="value">${fmt(nation.events)}</div></div>
            <div class="metric"><div class="label">Scores</div><div class="value">${fmt(nation.segment_scores)}</div></div>
            <div class="metric"><div class="label">Best TSS</div><div class="value">${points(nation.best_tss)}</div></div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">Mlad Figurist</div><div class="value">${fmt(nation.development_skaters)}</div></div>
            <div class="metric"><div class="label">Development Only</div><div class="value">${fmt(nation.development_only_skaters)}</div></div>
            <div class="metric"><div class="label">Converted</div><div class="value">${fmt(nation.converted_development_skaters)}</div></div>
            <div class="metric"><div class="label">Best PCS</div><div class="value">${points(nation.best_pcs)}</div></div>
          </div>
          ${renderNationSkaterTable()}
        </div>`;
    }

    function judgeHeaders(score) {
      if (score.judges && score.judges.length) return score.judges;
      const numbers = new Set();
      [...(score.elements || []), ...(score.components || [])].forEach((row) => {
        (row.judge_marks || []).forEach((mark) => numbers.add(mark.judge_number));
      });
      return [...numbers].sort((a, b) => a - b).map((judge_number) => ({ judge_number }));
    }

    function judgeName(judge) {
      const label = judge.function_text || `J${judge.judge_number}`;
      const nation = judge.nation_code ? ` ${judge.nation_code}` : "";
      const name = judge.name ? ` · ${judge.name}` : "";
      return `${label}${nation}${name}`;
    }

    // ISU element GOE marks are integers (-5..+5); ISU PCS marks are 0.25-step
    // values (e.g. 4.50, 4.75). Use 2-decimal formatting for non-integer
    // marks so component rows look uniform (4.50 alongside 4.75) instead of
    // 4.5 alongside 4.75.
    function formatJudgeScore(value, mode) {
      if (value === null || value === undefined || value === "") return "—";
      const num = typeof value === "number" ? value : Number(value);
      if (Number.isNaN(num)) return String(value);
      if (mode === "component") return num.toFixed(2);
      return Number.isInteger(num) ? String(num) : num.toFixed(2);
    }

    function judgeCells(row, judges, mode) {
      const orderedMarks = judges.map((judge) =>
        (row.judge_marks || []).find((mark) => mark.judge_number === judge.judge_number) || null
      );
      const trim = trimmedJudgeIndices(orderedMarks.map((mark, idx) => mark || { judge_number: judges[idx].judge_number, score: null }));
      return judges.map((judge, idx) => {
        const mark = orderedMarks[idx];
        const isTrimmed = trim.has(idx);
        const judgeName = mark && mark.judge_name ? mark.judge_name : `J${judge.judge_number}`;
        const baseTitle = isTrimmed
          ? `${judgeName} — trimmed (highest/lowest excluded from panel score per ISU rule)`
          : judgeName;
        const cls = isTrimmed ? "judge-trim" : "";
        const text = formatJudgeScore(mark && mark.score, mode);
        return `<td class="${cls}" title="${baseTitle.replace(/"/g, "&quot;")}">${text}</td>`;
      }).join("");
    }

    function scoreSourceBadge(source) {
      if (source === "pdf_score_summary") return '<span class="badge">PDF score summary</span>';
      if (source === "html_segment_result") return '<span class="badge warn">HTML fallback (no PDF detail)</span>';
      return source ? `<span class="badge">${fmt(source)}</span>` : "";
    }

    async function showScore(id) {
      await ensureLegend();
      const score = await getJson(`/api/scores/${id}`);
      const judges = judgeHeaders(score);
      const judgeCols = judges.map((judge) => `<th title="${judgeName(judge)}">J${judge.judge_number}</th>`).join("");
      const hasElements = Array.isArray(score.elements) && score.elements.length > 0;
      const hasComponents = Array.isArray(score.components) && score.components.length > 0;
      const legendKey = (hasElements || hasComponents) ? `
        <div class="legend-key">
          <span><span class="pill negative">&lt;&lt;</span> Base/GOE penalty</span>
          <span><span class="pill info">q</span> Information call</span>
          <span><span class="pill positive">x</span> Bonus credit</span>
          <span><span class="judge-trim">8.0</span> Highest/lowest trimmed (ISU panel rule)</span>
        </div>` : "";
      const elementLegend = elementLegendEntries(score.elements);
      const elementLegendBlock = elementLegend.length ? `
        <div class="legend-key">
          ${elementLegend.map(([code, desc]) => `<span><strong>${fmt(code)}</strong> · ${fmt(desc)}</span>`).join("")}
        </div>` : "";
      const elementsPanel = hasElements
        ? `<div class="panel">
            <h3>Elements</h3>
            <table>
              <thead><tr><th>#</th><th>Element</th><th>Markers</th><th>Base</th><th>GOE</th><th>Bonus</th><th>Score</th>${judgeCols}</tr></thead>
              <tbody>${score.elements.map((e) => {
                const codeTooltip = [describeElement(e.element_code), e.raw_element]
                  .filter(Boolean)
                  .join(" — ")
                  .replace(/"/g, "&quot;");
                return `
                <tr>
                  <td>${fmt(e.element_no)}</td>
                  <td title="${codeTooltip}">${fmt(e.element_code)}</td>
                  <td>${renderMarkerPills(e.markers)}</td>
                  ${numCell(e.base_value)}
                  ${numCell(e.goe, "goe")}
                  ${numCell(e.bonus, "bonus")}
                  ${numCell(e.panel_score)}
                  ${judgeCells(e, judges)}
                </tr>`;
              }).join("")}</tbody>
            </table>
            ${legendKey}
            ${elementLegendBlock}
          </div>`
        : "";
      const componentsPanel = hasComponents
        ? `<div class="panel">
            <h3>Components</h3>
            <table>
              <thead><tr><th>Component</th><th>Factor</th><th>Score</th>${judgeCols}</tr></thead>
              <tbody>${score.components.map((c) => {
                const factor = typeof c.factor === "number" ? c.factor : Number(c.factor);
                const factorCell = !Number.isNaN(factor) && factor !== 1
                  ? `<td><span class="badge" title="ISU factor multiplier applied to averaged judge marks">× ${factor.toFixed(2)}</span></td>`
                  : `<td>${points(c.factor)}</td>`;
                return `<tr><td>${fmt(c.component_name)}</td>${factorCell}${numCell(c.score)}${judgeCells(c, judges, "component")}</tr>`;
              }).join("")}</tbody>
            </table>
          </div>`
        : "";
      const noDetailNote = (!hasElements && !hasComponents)
        ? '<div class="empty">No PDF score detail available — only HTML placement was published for this segment.</div>'
        : "";
      detail.innerHTML = `
        <div class="stack">
          <div>
            <h2>${fmt(score.skater_name)} · ${fmt(score.segment_name)}</h2>
            <div class="muted">${fmt(score.event_name)} · ${fmt(score.category_name)} · ${fmt(score.event_start_date)} ${scoreSourceBadge(score.score_source)}</div>
          </div>
          <div class="grid">
            <div class="metric"><div class="label">TSS</div><div class="value">${points(score.tss)}</div></div>
            <div class="metric"><div class="label">TES</div><div class="value">${points(score.tes)}</div></div>
            <div class="metric"><div class="label">PCS</div><div class="value">${points(score.pcs)}</div></div>
            <div class="metric"><div class="label">Deduction</div><div class="value">${points(score.deduction)}</div></div>
          </div>
          <div class="panel">
            <h3>Judges</h3>
            ${judges.length ? table(["#", "Name", "Nation", "Function"], judges.map((j) => `
              <tr><td>${fmt(j.judge_number)}</td><td>${fmt(j.name)}</td><td>${fmt(j.nation_display || j.nation_code)}</td><td>${fmt(j.function_text)}</td></tr>`).join("")) : '<div class="muted">No judge panel recorded.</div>'}
          </div>
          ${noDetailNote}
          ${elementsPanel}
          ${componentsPanel}
          <div class="panel">
            <h3>Evidence</h3>
            ${(score.evidence || []).map((e) => `<div><a href="${e.source_url}" target="_blank" rel="noreferrer">${fmt(e.document_type)}</a> <span class="muted">${fmt(e.archive_status)} ${fmt(e.content_hash)}</span></div>`).join("") || '<div class="muted">No source document linked.</div>'}
          </div>
        </div>`;
    }

    document.querySelector("#dashboard-tab").addEventListener("click", () => navigate("dashboard"));
    document.querySelector("#club-tab").addEventListener("click", () => navigate("clubs"));
    document.querySelector("#skater-tab").addEventListener("click", () => navigate("skaters"));
    document.querySelector("#event-tab").addEventListener("click", () => navigate("events"));
    document.querySelector("#nationality-tab").addEventListener("click", () => navigate("nationalities"));
    document.querySelector("#back").addEventListener("click", () => history.back());

    document.querySelector("#list-sort").addEventListener("change", (event) => {
      const sort = state.listSort[state.mode] || { ...LIST_DEFAULT_SORT[state.mode] };
      state.listSort[state.mode] = { key: event.target.value, direction: sort.direction };
      state.listPage = 1;
      renderList();
    });
    document.querySelector("#list-direction").addEventListener("change", (event) => {
      const sort = state.listSort[state.mode] || { ...LIST_DEFAULT_SORT[state.mode] };
      state.listSort[state.mode] = { key: sort.key, direction: event.target.value };
      state.listPage = 1;
      renderList();
    });
    document.querySelector("#list-page-size").addEventListener("change", (event) => {
      state.listPageSize = Number(event.target.value);
      state.listPage = 1;
      renderList();
    });
    document.querySelector("#list-prev").addEventListener("click", () => {
      if (state.listPage > 1) { state.listPage -= 1; renderList(); }
    });
    document.querySelector("#list-next").addEventListener("click", () => {
      state.listPage += 1;
      renderList();
    });
    document.querySelector("#refresh").addEventListener("click", () => {
      // Re-fire whatever view we're currently on (dashboard, list, or
      // a detail page reached via a hash route).
      const current = parseRoute(window.location.hash);
      Promise.resolve(dispatchRoute(current)).catch((error) => {
        detail.innerHTML = `<div class="empty">API error: ${error.message}</div>`;
      });
    });
    document.querySelector("#search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      state.mode === "dashboard" ? loadDashboard() : loadList();
    });
    results.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      if (state.mode === "skaters") navigate("skater/" + button.dataset.id);
      if (state.mode === "clubs") navigate("club/" + button.dataset.id);
      if (state.mode === "events") navigate("event/" + button.dataset.id);
      if (state.mode === "nationalities") navigate("nation/" + button.dataset.id);
    });
    detail.addEventListener("click", (event) => {
      const link = event.target.closest("[data-score]");
      const club = event.target.closest("[data-club]");
      const skater = event.target.closest("[data-skater]");
      const nation = event.target.closest("[data-nation]");
      const scope = event.target.closest("[data-scope]");
      if (link) {
        event.preventDefault();
        navigate("score/" + link.dataset.score);
      }
      if (club) {
        event.preventDefault();
        navigate("club/" + club.dataset.club);
      }
      if (skater) {
        event.preventDefault();
        navigate("skater/" + skater.dataset.skater);
      }
      if (nation) {
        event.preventDefault();
        navigate("nation/" + nation.dataset.nation);
      }
      if (scope) {
        event.preventDefault();
        state.mode = "clubs";
        setTabState("clubs");
        getJson(`/api/clubs?scope=${scope.dataset.scope}&limit=40`).then((data) => {
          state.items = data.items;
          renderClubList(data.items);
        });
      }
      const pageStep = event.target.closest("[data-page-step]");
      if (pageStep && state.currentClub) {
        event.preventDefault();
        state.clubSkaterPage += Number(pageStep.dataset.pageStep);
        refreshClubSkaterRows();
      }
      const dashStep = event.target.closest("[data-dashboard-step]");
      if (dashStep && !dashStep.disabled && state.dashboardData) {
        event.preventDefault();
        const key = dashStep.dataset.dashboardTarget;
        state.dashboardPage[key] = (state.dashboardPage[key] || 1) + Number(dashStep.dataset.dashboardStep);
        refreshDashboardPanel(key);
      }
      const dashSortHeader = event.target.closest("[data-dashboard-sort]");
      if (dashSortHeader && state.dashboardData) {
        event.preventDefault();
        const panelKey = dashSortHeader.dataset.dashboardSort;
        const sortKey = dashSortHeader.dataset.sortKey;
        const current = state.dashboardSort[panelKey] || { key: null, direction: "desc" };
        const direction = current.key === sortKey
          ? (current.direction === "desc" ? "asc" : "desc")
          : "desc";
        state.dashboardSort[panelKey] = { key: sortKey, direction };
        state.dashboardPage[panelKey] = 1;
        refreshDashboardPanel(panelKey);
      }
      const nationSortHeader = event.target.closest("[data-nation-sort]");
      if (nationSortHeader && state.currentNation) {
        event.preventDefault();
        const sortKey = nationSortHeader.dataset.sortKey;
        const current = state.nationSkaterSort;
        const direction = current.key === sortKey
          ? (current.direction === "desc" ? "asc" : "desc")
          : "desc";
        state.nationSkaterSort = { key: sortKey, direction };
        state.nationSkaterPage = 1;
        refreshNationSkaterTable();
      }
      const nationPageStep = event.target.closest("[data-nation-page-step]");
      if (nationPageStep && !nationPageStep.disabled && state.currentNation) {
        event.preventDefault();
        state.nationSkaterPage += Number(nationPageStep.dataset.nationPageStep);
        refreshNationSkaterTable();
      }
    });
    detail.addEventListener("change", (event) => {
      if (event.target.id === "club-skater-sort") {
        state.clubSkaterSort.key = event.target.value;
        state.clubSkaterPage = 1;
        refreshClubSkaterRows();
      }
      if (event.target.id === "club-skater-direction") {
        state.clubSkaterSort.direction = event.target.value;
        state.clubSkaterPage = 1;
        refreshClubSkaterRows();
      }
      if (event.target.id === "club-skater-page-size") {
        state.clubSkaterPageSize = Number(event.target.value);
        state.clubSkaterPage = 1;
        refreshClubSkaterRows();
      }
      if (event.target.id === "dashboard-from-year" || event.target.id === "dashboard-to-year") {
        const fromVal = document.querySelector("#dashboard-from-year").value;
        const toVal = document.querySelector("#dashboard-to-year").value;
        const period = {
          from: fromVal ? Number(fromVal) : null,
          to: toVal ? Number(toVal) : null
        };
        const hashId = periodHashId(period);
        navigate(hashId ? "dashboard/" + hashId : "dashboard");
      }
    });
    detail.addEventListener("click", (event) => {
      if (event.target.id === "dashboard-clear-period") {
        event.preventDefault();
        navigate("dashboard");
      }
    });
    window.addEventListener("popstate", (event) => {
      const stored = event.state && event.state.route;
      const route = stored ? parseRoute(stored) : parseRoute(window.location.hash);
      Promise.resolve(dispatchRoute(route)).catch((error) => {
        detail.innerHTML = `<div class="empty">API error: ${error.message}</div>`;
      });
    });

    Promise.resolve(dispatchRoute(parseRoute(window.location.hash))).catch((error) => {
      detail.innerHTML = `<div class="empty">API error: ${error.message}</div>`;
    });
  </script>
</body>
</html>
